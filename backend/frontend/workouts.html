<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workout Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Workout Tracker</h1>

    <!-- Main container with form and workout list side by side -->
    <div class="main-container">
        <!-- Workout Form -->
        <div class="workout-form">
            <h2>Add a New Workout</h2>
            <input type="text" id="title" placeholder="Workout Title" required>
            <input type="number" id="reps" placeholder="Reps" required>
            <input type="number" id="load" placeholder="Load (kg)" required>
            <button onclick="addWorkout()">Add Workout</button>
        </div>

        <!-- Workouts List -->
        <div class="workout-list">
            <h2>Your Workouts</h2>
            <div id="workouts"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
