<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    
    <title>Music Playlist</title>
  </head>
  <body>
    <div id="wrapper">
      <!-- Playlist Section -->
      <header>
        <div id="page-banner">
          <h1 class="title">My Music Playlist</h1>
          <form id="search-songs">
            <input type="text" placeholder="Search for a song..." />
          </form>
        </div>
        <div id="song-list">
          <ul>
            <li>
              <span class="name">Sell yo Soul</span>
              <span>Artist: Towa</span>
              <span class="delete">Delete</span>
            </li>
            <li>
              <span class="name">Devils Work</span>
              <span>Artist: Freddie Dred</span>
              <span class="delete">Delete</span>
            </li>
            <li>
              <span class="name">Me And The Devil</span>
              <span>Artist: Soap And Skin</span>
              <span class="delete">Delete</span>
            </li>
          </ul>
        </div>
      </header>

      <!-- Add a Song Section -->
      <form id="add-song">
        <h2 class="title">Add a New Song</h2>
        <input type="text" placeholder="Enter song title"/>
        <input type="text" placeholder="Enter artist name"/>
        <button type="submit">Add Song</button>
      </form>
    </div>
    <script defer src="app.js"></script>
  </body>
</html>
